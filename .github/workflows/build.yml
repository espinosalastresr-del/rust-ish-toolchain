# Silencia la advertencia sobre change-id (opcional pero recomendado)
change-id = "ignore"

[build]
build = "i586-alpine-linux-musl"
host = ["i586-alpine-linux-musl"]
target = ["i586-alpine-linux-musl"]
extended = true
tools = ["cargo", "rustfmt", "rustdoc"]
submodules = false
locked-deps = true

# Usa el compilador y cargo instalados por apk
rustc = "/usr/bin/rustc"
cargo = "/usr/bin/cargo"

[rust]
# Evita descargar componentes precompilados
download-rustc = false

debuginfo-level = 0
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 1

[target.i586-alpine-linux-musl]
cc = "gcc"
cxx = "g++"
ar = "ar"
linker = "gcc"

# Cambia "pentium" por "i686" para mejor compatibilidad con iSH
# (si aún ves errores de SSE, añade +sse2)
rustflags = [
    "-Ctarget-cpu=i686"
]