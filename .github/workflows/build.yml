name: Build Rust for iSH

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust
        run: |
          docker run --rm \
            --platform linux/386 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e RUST_VERSION="${RUST_VERSION}" \
            -e TARGET_CPU="${TARGET_CPU}" \
            alpine:3.24 \
            sh -euxc '
              apk add --no-cache \
                bash build-base clang cmake curl file git \
                linux-headers llvm make musl-dev openssl-dev \
                perl python3 rust cargo rust-src rust-stdlib \
                tar xz
              bash scripts/build.sh
            '
        env:
          RUST_VERSION: 1.96.1
          TARGET_CPU: i686  # o pentium, pero recomendamos i686