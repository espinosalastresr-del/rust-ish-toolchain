change-id = "ignore"

[build]
build = "i586-alpine-linux-musl"
host = ["i586-alpine-linux-musl"]
target = ["i586-alpine-linux-musl"]
extended = true
tools = ["cargo", "rustfmt", "clippy", "rustdoc"]
submodules = false
locked-deps = true
rustc = "/usr/bin/rustc"
cargo = "/usr/bin/cargo"

[llvm]
# Deja que Rust descargue y compile LLVM desde el código fuente
download-ci-llvm = true
# No uses llvm-config (no está en el sistema)
ninja = true

[rust]
download-rustc = false
debuginfo-level = 0
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16
lto = "off"

[target.i586-alpine-linux-musl]
cc = "gcc"
cxx = "g++"
ar = "ar"
linker = "gcc"
# No incluyas llvm-config aquí
rustflags = [
    "-Ctarget-cpu=i686",
    "-Ctarget-feature=+sse,+sse2"
]