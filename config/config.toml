change-id = "ignore"

[build]
build = "i586-alpine-linux-musl"
host = ["i586-alpine-linux-musl"]
target = ["i586-alpine-linux-musl"]
extended = true
tools = ["cargo", "rustfmt", "clippy", "rustdoc"]
submodules = false
locked-deps = true
rustc = "/usr/bin/rustc"
cargo = "/usr/bin/cargo"

[llvm]
download-ci-llvm = false

[rust]
download-rustc = false
debuginfo-level = 0
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16
lto = false

[target.i586-alpine-linux-musl]
cc = "gcc"
cxx = "g++"
ar = "ar"
linker = "gcc"
llvm-config = "/usr/bin/llvm-config"   # <--- AQUÍ es donde debe ir
rustflags = [
    "-Ctarget-cpu=i686",
    "-Ctarget-feature=+sse,+sse2"
]