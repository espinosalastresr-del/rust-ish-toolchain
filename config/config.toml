[build]
build = "i586-alpine-linux-musl"
host = ["i586-alpine-linux-musl"]
target = ["i586-alpine-linux-musl"]

extended = true
tools = ["cargo", "rustfmt", "rustdoc"]
submodules = false
locked-deps = true

# Usa el compilador y cargo instalados en el sistema
rustc = "/usr/bin/rustc"
cargo = "/usr/bin/cargo"

[rust]
# No descargues componentes precompilados
download-rustc = false
# Compila la biblioteca estándar desde el código fuente
build-std = true

debuginfo-level = 0
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 1

[target.i586-alpine-linux-musl]
cc = "gcc"
cxx = "g++"
ar = "ar"
linker = "gcc"
rustflags = [
    "-Ctarget-cpu=pentium"
]